<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Warm beige rounded square — matches site bg -->
  <rect width="32" height="32" rx="7" fill="#EFE2CC"/>

  <!-- Lotus — left petal (behind, transparent) -->
  <path d="M16 22 C11 18 11 9 16 6 C21 9 21 18 16 22Z"
        fill="#B89570" fill-opacity="0.45" transform="rotate(-28 16 22)"/>

  <!-- Lotus — right petal (behind, transparent) -->
  <path d="M16 22 C11 18 11 9 16 6 C21 9 21 18 16 22Z"
        fill="#B89570" fill-opacity="0.45" transform="rotate(28 16 22)"/>

  <!-- Lotus — center petal (front, full copper) -->
  <path d="M16 22 C11 18 11 9 16 6 C21 9 21 18 16 22Z"
        fill="#9A7454"/>

  <!-- Subtle water line at base -->
  <path d="M9 25 Q16 23.5 23 25"
        stroke="#9A7454" stroke-width="0.9" stroke-linecap="round"
        fill="none" stroke-opacity="0.35"/>
</svg>
